{{define "content"}}
<tr>
  <td style="padding-bottom: 22px;">
    <p class="email-text">{{if .Name}}Hello {{.Name}},{{else}}Hello,{{end}}</p>
  </td>
</tr>
<tr>
  <td style="padding-bottom: 22px;">
    <p class="email-text">Use this code to verify the email address for your KeelTube account.</p>
  </td>
</tr>
<tr>
  <td style="padding-bottom: 22px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td class="email-code">{{.Code}}</td>
      </tr>
    </table>
  </td>
</tr>
<tr>
  <td style="padding-bottom: 22px;">
    <p class="email-text">The code expires at {{.ExpiresAtText}} ({{.ExpiresInText}} from now).</p>
  </td>
</tr>
{{end}}
