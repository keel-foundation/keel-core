name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tubekeel
          POSTGRES_PASSWORD: tubekeel-dev
          POSTGRES_DB: tubekeel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tubekeel -d tubekeel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TUBEKEEL_TEST_DATABASE_URL: postgres://tubekeel:tubekeel-dev@localhost:5432/tubekeel_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -p 1 ./...
